<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b1220" />
<title>Overhead</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(ellipse at top, #16233b 0%, #0a0f1a 70%);
    color: #eef2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    text-align: center;
  }

  /* --- Start screen --- */
  #start-screen { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #start-screen h1 { font-size: 22px; margin: 0; font-weight: 600; }
  #start-screen p { color: #8b98ac; font-size: 14px; margin: 0; max-width: 260px; line-height: 1.4; }
  #enable-btn {
    background: #1d6fd8; color: white; border: none; border-radius: 14px;
    padding: 14px 28px; font-size: 16px; font-weight: 600;
  }
  #enable-btn:active { opacity: 0.8; }

  /* --- Sky screen --- */
  #sky-screen { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #plane-wrap { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #plane-icon { transition: transform 0.6s ease; filter: drop-shadow(0 0 10px rgba(120,170,255,0.35)); }
  #callsign { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  #hint { font-size: 13px; color: #6b7688; }
  #distance { font-size: 13px; color: #8b98ac; }
  #empty-msg { color: #8b98ac; font-size: 14px; max-width: 260px; line-height: 1.5; }
  #searching { color: #6b7688; font-size: 13px; }

  /* --- Popup --- */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
  }
  #popup {
    background: #141d2e; width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 24px 22px calc(28px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.3s ease;
  }
  #overlay.show #popup { transform: translateY(0); }
  #popup h2 { margin: 0 0 4px; font-size: 20px; }
  #popup .airline { color: #8b98ac; font-size: 14px; margin-bottom: 18px; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid #223049; font-size: 14px; }
  .row .label { color: #8b98ac; }
  #close-btn {
    margin-top: 18px; width: 100%; background: #1e2a42; color: #eef2f7;
    border: none; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 600;
  }
</style>
</head>
<body>
<div id="app">

  <div id="start-screen">
    <h1>Overhead</h1>
    <p>Shows the plane currently flying above you, live.</p>
    <button id="enable-btn">Enable & Look Up</button>
  </div>

  <div id="sky-screen">
    <div id="searching" style="display:none;">Scanning the sky…</div>
    <div id="plane-wrap" style="display:none;">
      <svg id="plane-icon" width="90" height="90" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#eef2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M50 8 L50 62"/>
          <path d="M50 30 L88 52 L50 44 L12 52 Z"/>
          <path d="M50 55 L62 70 L50 65 L38 70 Z"/>
        </g>
      </svg>
      <div id="callsign">—</div>
      <div id="distance"></div>
      <div id="hint">Tap the plane for details</div>
    </div>
    <div id="empty-msg" style="display:none;">No aircraft directly overhead right now. Sit tight — this refreshes automatically.</div>
  </div>

</div>

<div id="overlay">
  <div id="popup">
    <h2 id="p-callsign">—</h2>
    <div class="airline" id="p-airline">—</div>
    <div class="row"><span class="label">Aircraft</span><span id="p-type">—</span></div>
    <div class="row"><span class="label">From</span><span id="p-from">—</span></div>
    <div class="row"><span class="label">To</span><span id="p-to">—</span></div>
    <div class="row"><span class="label">Altitude</span><span id="p-alt">—</span></div>
    <div class="row"><span class="label">Speed</span><span id="p-speed">—</span></div>
    <button id="close-btn">Close</button>
  </div>
</div>

<script>
let userLat = null, userLon = null;
let currentPlane = null;
let pollTimer = null;

const startScreen = document.getElementById('start-screen');
const skyScreen = document.getElementById('sky-screen');
const searching = document.getElementById('searching');
const planeWrap = document.getElementById('plane-wrap');
const emptyMsg = document.getElementById('empty-msg');
const planeIcon = document.getElementById('plane-icon');
const callsignEl = document.getElementById('callsign');
const distanceEl = document.getElementById('distance');

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function findOverheadPlane() {
  const d = 0.5;
  const url = `https://opensky-network.org/api/states/all?lamin=${userLat-d}&lomin=${userLon-d}&lamax=${userLat+d}&lomax=${userLon+d}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    const states = (data.states || []).filter(s => s[5] && s[6] && s[7] != null);
    if (states.length === 0) { showEmpty(); return; }

    let nearest = null, nearestDist = Infinity;
    for (const s of states) {
      const dist = haversine(userLat, userLon, s[6], s[5]);
      if (dist < nearestDist) { nearestDist = dist; nearest = s; }
    }
    showPlane(nearest, nearestDist);
  } catch (e) {
    showEmpty();
  }
}

function showEmpty() {
  searching.style.display = 'none';
  planeWrap.style.display = 'none';
  emptyMsg.style.display = 'block';
}

function showPlane(s, distKm) {
  const [icao24, callsign,, , , , , baroAlt, , velocity, heading] = s;
  currentPlane = { icao24, callsign: (callsign||'Unknown').trim(), baroAlt, velocity, heading, distKm };

  searching.style.display = 'none';
  emptyMsg.style.display = 'none';
  planeWrap.style.display = 'flex';

  callsignEl.textContent = currentPlane.callsign;
  distanceEl.textContent = `${distKm < 1 ? Math.round(distKm*1000)+' m' : distKm.toFixed(1)+' km'} away · ${baroAlt ? Math.round(baroAlt*3.281).toLocaleString()+' ft' : '—'}`;
  if (heading != null) planeIcon.style.transform = `rotate(${heading}deg)`;
}

async function openPopup() {
  if (!currentPlane) return;
  document.getElementById('p-callsign').textContent = currentPlane.callsign;
  document.getElementById('p-airline').textContent = 'Looking up…';
  document.getElementById('p-type').textContent = '—';
  document.getElementById('p-from').textContent = '—';
  document.getElementById('p-to').textContent = '—';
  document.getElementById('p-alt').textContent = currentPlane.baroAlt ? Math.round(currentPlane.baroAlt*3.281).toLocaleString()+' ft' : '—';
  document.getElementById('p-speed').textContent = currentPlane.velocity ? Math.round(currentPlane.velocity*1.944)+' kts' : '—';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('overlay').style.display = 'flex';

  try {
    const res = await fetch(`https://hexdb.io/api/v1/aircraft/${currentPlane.icao24}`);
    if (res.ok) {
      const info = await res.json();
      document.getElementById('p-airline').textContent = info.RegisteredOwners || 'Unknown operator';
      const type = [info.Manufacturer, info.Type].filter(Boolean).join(' ');
      document.getElementById('p-type').textContent = type || '—';
    } else {
      document.getElementById('p-airline').textContent = 'Unknown operator';
    }
  } catch (e) {
    document.getElementById('p-airline').textContent = 'Unknown operator';
  }

  try {
    const res2 = await fetch(`https://api.adsbdb.com/v0/callsign/${currentPlane.callsign}`);
    if (res2.ok) {
      const routeData = await res2.json();
      const fr = routeData?.response?.flightroute;
      if (fr) {
        document.getElementById('p-from').textContent = fr.origin?.name || fr.origin?.iata_code || '—';
        document.getElementById('p-to').textContent = fr.destination?.name || fr.destination?.iata_code || '—';
      }
    }
  } catch (e) { /* leave as — */ }
}

function closePopup() {
  document.getElementById('overlay').classList.remove('show');
  setTimeout(() => { document.getElementById('overlay').style.display = 'none'; }, 300);
}

document.getElementById('plane-wrap').addEventListener('click', openPopup);
document.getElementById('close-btn').addEventListener('click', closePopup);
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closePopup(); });

document.getElementById('enable-btn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    alert('Location is not supported on this device.');
    return;
  }
  startScreen.style.display = 'none';
  skyScreen.style.display = 'flex';
  searching.style.display = 'block';

  navigator.geolocation.watchPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      findOverheadPlane();
      if (!pollTimer) pollTimer = setInterval(findOverheadPlane, 15000);
    },
    err => {
      searching.style.display = 'none';
      emptyMsg.style.display = 'block';
      emptyMsg.textContent = 'Location access denied. Enable it in your phone settings to use this app.';
    },
    { enableHighAccuracy: true, maximumAge: 10000 }
  );
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
